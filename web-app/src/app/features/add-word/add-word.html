<form class="card" (submit)="addWord($event)">
  <h1 class="title">Add a word</h1>
  <p class="subtitle">Enter the word, its translation and word type.</p>

  <div class="field-row">
    <div class="field field--word">
      <label class="sr-only" for="word">English word</label>
      <input
        id="word"
        name="word"
        class="input"
        type="text"
        placeholder="Word in English"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        required
        [value]="word()"
        (input)="onWordInput($event)"
      />
    </div>

    <div class="field field--type">
      <label class="sr-only" for="wordType">Word type</label>
      <select
        id="wordType"
        name="wordType"
        class="input select"
        required
        [value]="wordTypeId() ?? ''"
        [disabled]="typesLoading() || wordTypes().length === 0"
        (change)="onWordTypeChange($event)"
      >
        <option value="" disabled>
          {{ typesLoading() ? 'Loading...' : 'Word type' }}
        </option>
        @for (wordType of wordTypes(); track wordType.id) {
          <option [value]="wordType.id">{{ wordType.wordType }}</option>
        }
      </select>
    </div>
  </div>

  <div class="field">
    <label class="sr-only" for="translation">Translation</label>
    <input
      id="translation"
      name="translation"
      class="input"
      type="text"
      placeholder="Translation in Spanish"
      autocomplete="off"
      required
      [value]="translation()"
      (input)="onTranslationInput($event)"
    />
  </div>

  <button
    class="submit"
    type="submit"
    [disabled]="loading() || typesLoading() || wordTypes().length === 0"
  >
    Add word
  </button>
</form>
